# OpenTelemetry Collector config for Agent Teams for Relationship Managers
# ADK auto-emits gen_ai.* traces — this collector receives and forwards them
# Deploy: docker run -v $(pwd)/observability:/etc/otel otel/opentelemetry-collector-contrib

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop PII from prompt content before it reaches the backend
  # Keeps gen_ai.request.model, token counts, latency — strips raw prompt text
  filter/drop_prompt_content:
    traces:
      span:
        - 'attributes["gen_ai.input.messages"] != nil'   # comment out to enable prompt logging

  # Add banking-specific resource attributes
  resource:
    attributes:
      - key: service.name
        value: fsi-rm-agent-system
        action: upsert
      - key: deployment.environment
        value: poc
        action: upsert
      - key: cloud.region
        value: asia-south1
        action: upsert

  # Batch for efficiency
  batch:
    timeout: 5s
    send_batch_size: 100

exporters:
  # Google Cloud Trace (primary — integrates with Cloud Monitoring dashboards)
  googlecloud:
    project: ${GCP_PROJECT}
    trace:
      endpoint: cloudtrace.googleapis.com

  # Debug output locally
  logging:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [googlecloud, logging]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [googlecloud]
